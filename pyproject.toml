[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hi-ev"
version = "0.1.0"
description = "EV — personal AI operating system"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "pgvector>=0.2.5",
    "psycopg2-binary>=2.9.9",
    "asyncpg>=0.29.0",
    "redis>=5.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "httpx>=0.27.0",
    "click>=8.1.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "aiosqlite>=0.20.0",
    "factory-boy>=3.3.0",
    "ruff>=0.4.0",
]

[project.scripts]
ev = "ev.cli.main:cli"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
