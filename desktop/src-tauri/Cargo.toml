[package]
name = "hi-ev-desktop"
version = "0.1.0"
description = "Hi-EV — Personal AI OS desktop shell"
authors = ["Satyam Das"]
edition = "2021"
rust-version = "1.75"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2.0.0"
tauri-plugin-notification = "2.0.0"
tauri-plugin-global-shortcut = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["process", "time", "sync", "rt-multi-thread"] }
reqwest = { version = "0.12", features = ["json"] }
uuid = { version = "1.10", features = ["v4"] }
keyboard-types = "0.7"

[profile.release]
strip = true
lto = true
opt-level = 3
